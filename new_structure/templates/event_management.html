<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event & Meeting Management - Parent Management</title>
    <style>
      :root {
        /* Solar Theme Colors */
        --solar-base03: #002b36;
        --solar-base02: #073642;
        --solar-base01: #586e75;
        --solar-base00: #657b83;
        --solar-base0: #839496;
        --solar-base1: #93a1a1;
        --solar-base2: #eee8d5;
        --solar-base3: #fdf6e3;
        --solar-yellow: #b58900;
        --solar-orange: #cb4b16;
        --solar-red: #dc322f;
        --solar-magenta: #d33682;
        --solar-violet: #6c71c4;
        --solar-blue: #268bd2;
        --solar-cyan: #2aa198;
        --solar-green: #859900;
      }

      body {
        background: var(--solar-base03);
        color: var(--solar-base0);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      .event-container {
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-header {
        background: rgba(7, 54, 66, 0.95);
        color: var(--solar-base3);
        border: 1px solid rgba(131, 148, 150, 0.3);
        padding: 24px;
        border-radius: 1rem;
        margin-bottom: 24px;
        text-align: center;
      }

      .action-tabs {
        display: flex;
        background: rgba(7, 54, 66, 0.95);
        border: 1px solid rgba(131, 148, 150, 0.3);
        border-radius: 1rem;
        margin-bottom: 24px;
        padding: 4px;
      }

      .tab-btn {
        flex: 1;
        padding: 12px 16px;
        background: none;
        border: none;
        color: var(--solar-base1);
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.2s;
        font-weight: 500;
      }

      .tab-btn.active {
        background: var(--solar-blue);
        color: var(--solar-base3);
      }

      .tab-btn:hover:not(.active) {
        background: rgba(131, 148, 150, 0.1);
        color: var(--solar-base0);
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .events-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .event-card {
        background: rgba(7, 54, 66, 0.95);
        border: 1px solid rgba(131, 148, 150, 0.3);
        border-radius: 1rem;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      .event-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--solar-green);
      }

      .event-card.conference::before {
        background: var(--solar-blue);
      }
      .event-card.meeting::before {
        background: var(--solar-orange);
      }
      .event-card.social::before {
        background: var(--solar-magenta);
      }

      .event-header {
        display: flex;
        justify-content: between;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .event-title {
        color: var(--solar-base3);
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .event-type {
        background: rgba(131, 148, 150, 0.2);
        color: var(--solar-base1);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .event-details {
        margin-bottom: 16px;
      }

      .event-detail-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--solar-base1);
        font-size: 0.9rem;
      }

      .event-detail-icon {
        width: 16px;
        height: 16px;
        color: var(--solar-blue);
      }

      .event-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        background: var(--solar-blue);
        color: var(--solar-base3);
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .btn:hover {
        background: var(--solar-cyan);
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: var(--solar-base01);
        color: var(--solar-base1);
      }

      .btn-secondary:hover {
        background: var(--solar-base00);
        color: var(--solar-base2);
      }

      .btn-danger {
        background: var(--solar-red);
        color: var(--solar-base3);
      }

      .btn-danger:hover {
        background: var(--solar-orange);
      }

      .create-event-form {
        background: rgba(7, 54, 66, 0.95);
        border: 1px solid rgba(131, 148, 150, 0.3);
        border-radius: 1rem;
        padding: 24px;
        margin-bottom: 24px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-label {
        color: var(--solar-base1);
        font-weight: 500;
        margin-bottom: 8px;
      }

      .form-input,
      .form-select,
      .form-textarea {
        background: rgba(131, 148, 150, 0.1);
        border: 1px solid rgba(131, 148, 150, 0.3);
        color: var(--solar-base0);
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
      }

      .form-textarea {
        resize: vertical;
        min-height: 80px;
      }

      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        outline: none;
        border-color: var(--solar-blue);
        background: rgba(38, 139, 210, 0.1);
      }

      .calendar-view {
        background: rgba(7, 54, 66, 0.95);
        border: 1px solid rgba(131, 148, 150, 0.3);
        border-radius: 1rem;
        padding: 24px;
        margin-bottom: 24px;
      }

      .calendar-header {
        display: flex;
        justify-content: between;
        align-items: center;
        margin-bottom: 20px;
      }

      .calendar-nav {
        display: flex;
        gap: 8px;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px;
        background: rgba(131, 148, 150, 0.2);
        border-radius: 8px;
        overflow: hidden;
      }

      .calendar-day {
        background: var(--solar-base03);
        padding: 12px 8px;
        text-align: center;
        color: var(--solar-base1);
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .calendar-day.header {
        background: var(--solar-base02);
        color: var(--solar-base0);
        font-weight: 600;
        min-height: auto;
        padding: 8px;
      }

      .calendar-day.today {
        background: rgba(38, 139, 210, 0.2);
        color: var(--solar-base3);
      }

      .calendar-day.has-events {
        background: rgba(181, 137, 0, 0.1);
      }

      .event-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--solar-yellow);
        margin-top: 4px;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(7, 54, 66, 0.95);
        border: 1px solid rgba(131, 148, 150, 0.3);
        color: var(--solar-base1);
        padding: 10px 16px;
        border-radius: 8px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
      }

      .back-btn:hover {
        background: var(--solar-base02);
        color: var(--solar-base3);
      }

      .stats-row {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .stat-item {
        background: rgba(7, 54, 66, 0.95);
        border: 1px solid rgba(131, 148, 150, 0.3);
        border-radius: 8px;
        padding: 16px 20px;
        text-align: center;
        flex: 1;
        min-width: 150px;
      }

      .stat-number {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--solar-yellow);
        margin-bottom: 4px;
      }

      .stat-label {
        color: var(--solar-base1);
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .event-container {
          padding: 16px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .calendar-grid {
          font-size: 14px;
        }

        .calendar-day {
          min-height: 50px;
          padding: 8px 4px;
        }
      }
    </style>
  </head>
  <body>
    <a href="/parent_management/dashboard" class="back-btn">
      <svg
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        ></path>
      </svg>
      Back to Dashboard
    </a>

    <div class="event-container">
      <div class="page-header">
        <h1>📅 Event & Meeting Management</h1>
        <p>Schedule parent-teacher conferences, school events, and meetings</p>
      </div>

      <!-- Statistics -->
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-number" id="upcomingEvents">5</div>
          <div class="stat-label">Upcoming Events</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="totalRSVPs">127</div>
          <div class="stat-label">Total RSVPs</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="scheduledConferences">18</div>
          <div class="stat-label">Conferences Scheduled</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="attendanceRate">92%</div>
          <div class="stat-label">Attendance Rate</div>
        </div>
      </div>

      <!-- Action Tabs -->
      <div class="action-tabs">
        <button class="tab-btn active" onclick="switchTab('events')">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          View Events
        </button>
        <button class="tab-btn" onclick="switchTab('create')">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
          Create Event
        </button>
        <button class="tab-btn" onclick="switchTab('conferences')">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
            ></path>
          </svg>
          Conferences
        </button>
        <button class="tab-btn" onclick="switchTab('calendar')">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"
            ></path>
          </svg>
          Calendar View
        </button>
      </div>

      <!-- Events Tab -->
      <div id="eventsTab" class="tab-content active">
        <div class="events-grid" id="eventsGrid">
          <!-- Events will be loaded here -->
        </div>
      </div>

      <!-- Create Event Tab -->
      <div id="createTab" class="tab-content">
        <div class="create-event-form">
          <h3 style="color: var(--solar-base3); margin-bottom: 20px">
            Create New Event
          </h3>
          <form id="createEventForm" onsubmit="createEvent(event)">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Event Title *</label>
                <input
                  type="text"
                  class="form-input"
                  id="eventTitle"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">Event Type *</label>
                <select class="form-select" id="eventType" required>
                  <option value="">Select type...</option>
                  <option value="conference">Parent-Teacher Conference</option>
                  <option value="meeting">School Meeting</option>
                  <option value="social">Social Event</option>
                  <option value="academic">Academic Event</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Date *</label>
                <input type="date" class="form-input" id="eventDate" required />
              </div>
              <div class="form-group">
                <label class="form-label">Start Time *</label>
                <input type="time" class="form-input" id="eventTime" required />
              </div>
              <div class="form-group">
                <label class="form-label">Duration (minutes)</label>
                <input
                  type="number"
                  class="form-input"
                  id="eventDuration"
                  value="60"
                  min="15"
                  max="480"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Location</label>
                <input
                  type="text"
                  class="form-input"
                  id="eventLocation"
                  placeholder="e.g., Main Hall, Room 101"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Max Attendees</label>
                <input
                  type="number"
                  class="form-input"
                  id="eventMaxAttendees"
                  min="1"
                  max="500"
                />
              </div>
              <div class="form-group">
                <label
                  class="form-label"
                  style="display: flex; align-items: center; gap: 8px"
                >
                  <input type="checkbox" id="requiresRSVP" style="margin: 0" />
                  Requires RSVP
                </label>
              </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px">
              <label class="form-label">Description</label>
              <textarea
                class="form-textarea"
                id="eventDescription"
                placeholder="Event details, agenda, special instructions..."
              ></textarea>
            </div>
            <div style="display: flex; gap: 12px">
              <button type="submit" class="btn">Create Event</button>
              <button
                type="button"
                class="btn btn-secondary"
                onclick="resetForm()"
              >
                Clear Form
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Conferences Tab -->
      <div id="conferencesTab" class="tab-content">
        <div class="create-event-form">
          <h3 style="color: var(--solar-base3); margin-bottom: 20px">
            Schedule Parent-Teacher Conference
          </h3>
          <form id="conferenceForm" onsubmit="scheduleConference(event)">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Parent *</label>
                <select class="form-select" id="conferenceParent" required>
                  <option value="">Select parent...</option>
                  <!-- Parents will be loaded here -->
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Student *</label>
                <select class="form-select" id="conferenceStudent" required>
                  <option value="">Select student...</option>
                  <!-- Students will be loaded here -->
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Teacher *</label>
                <select class="form-select" id="conferenceTeacher" required>
                  <option value="">Select teacher...</option>
                  <option value="1">Mr. Johnson (Math)</option>
                  <option value="2">Ms. Smith (English)</option>
                  <option value="3">Dr. Brown (Science)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Date *</label>
                <input
                  type="date"
                  class="form-input"
                  id="conferenceDate"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">Time Slot *</label>
                <select class="form-select" id="conferenceTimeSlot" required>
                  <option value="">Available slots will appear here</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Duration (minutes)</label>
                <select class="form-select" id="conferenceDuration">
                  <option value="15">15 minutes</option>
                  <option value="30" selected>30 minutes</option>
                  <option value="45">45 minutes</option>
                  <option value="60">60 minutes</option>
                </select>
              </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px">
              <label class="form-label">Meeting Notes</label>
              <textarea
                class="form-textarea"
                id="conferenceNotes"
                placeholder="Topics to discuss, special concerns..."
              ></textarea>
            </div>
            <div style="display: flex; gap: 12px">
              <button type="submit" class="btn">Schedule Conference</button>
              <button
                type="button"
                class="btn btn-secondary"
                onclick="resetConferenceForm()"
              >
                Clear Form
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Calendar Tab -->
      <div id="calendarTab" class="tab-content">
        <div class="calendar-view">
          <div class="calendar-header">
            <h3 style="color: var(--solar-base3); margin: 0">October 2025</h3>
            <div class="calendar-nav">
              <button class="btn btn-secondary">← Previous</button>
              <button class="btn btn-secondary">Today</button>
              <button class="btn btn-secondary">Next →</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendarGrid">
            <!-- Calendar will be generated here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentTab = "events";

      // Initialize page
      document.addEventListener("DOMContentLoaded", function () {
        loadEvents();
        generateCalendar();
        loadParentsAndStudents();
      });

      function switchTab(tabName) {
        // Hide all tabs
        document.querySelectorAll(".tab-content").forEach((tab) => {
          tab.classList.remove("active");
        });

        // Remove active class from all buttons
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove("active");
        });

        // Show selected tab and activate button
        document.getElementById(tabName + "Tab").classList.add("active");
        event.target.classList.add("active");

        currentTab = tabName;

        if (tabName === "events") {
          loadEvents();
        } else if (tabName === "calendar") {
          generateCalendar();
        }
      }

      async function loadEvents() {
        try {
          const response = await fetch("/parent_management/get_events");
          const data = await response.json();

          if (data.success) {
            displayEvents(data.events);
          }
        } catch (error) {
          console.error("Error loading events:", error);
        }
      }

      function displayEvents(events) {
        const grid = document.getElementById("eventsGrid");

        if (events.length === 0) {
          grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--solar-base1);">
                        <svg style="width: 48px; height: 48px; margin-bottom: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <h3>No Events Scheduled</h3>
                        <p>Click "Create Event" to schedule your first event.</p>
                    </div>
                `;
          return;
        }

        grid.innerHTML = events
          .map(
            (event) => `
                <div class="event-card ${event.type}">
                    <div class="event-header">
                        <div>
                            <div class="event-title">${event.title}</div>
                            <span class="event-type">${event.type}</span>
                        </div>
                    </div>
                    <div class="event-details">
                        <div class="event-detail-item">
                            <svg class="event-detail-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            ${event.date} at ${event.time}
                        </div>
                        <div class="event-detail-item">
                            <svg class="event-detail-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                            </svg>
                            ${event.attendees}/${event.max_attendees} attending
                        </div>
                    </div>
                    <div class="event-actions">
                        <button class="btn btn-secondary" onclick="editEvent(${event.id})">Edit</button>
                        <button class="btn" onclick="viewAttendees(${event.id})">Attendees</button>
                        <button class="btn btn-danger" onclick="cancelEvent(${event.id})">Cancel</button>
                    </div>
                </div>
            `
          )
          .join("");
      }

      async function createEvent(event) {
        event.preventDefault();

        const formData = {
          title: document.getElementById("eventTitle").value,
          event_type: document.getElementById("eventType").value,
          date: document.getElementById("eventDate").value,
          time: document.getElementById("eventTime").value,
          duration: document.getElementById("eventDuration").value,
          location: document.getElementById("eventLocation").value,
          max_attendees: document.getElementById("eventMaxAttendees").value,
          requires_rsvp: document.getElementById("requiresRSVP").checked,
          description: document.getElementById("eventDescription").value,
        };

        try {
          const response = await fetch("/parent_management/create_event", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(formData),
          });

          const result = await response.json();

          if (result.success) {
            alert("Event created successfully!");
            resetForm();
            switchTab("events");
            loadEvents();
          } else {
            alert("Error creating event: " + result.message);
          }
        } catch (error) {
          alert("Error creating event: " + error.message);
        }
      }

      async function scheduleConference(event) {
        event.preventDefault();

        const formData = {
          parent_id: document.getElementById("conferenceParent").value,
          student_id: document.getElementById("conferenceStudent").value,
          teacher_id: document.getElementById("conferenceTeacher").value,
          date: document.getElementById("conferenceDate").value,
          time_slot: document.getElementById("conferenceTimeSlot").value,
          duration: document.getElementById("conferenceDuration").value,
          notes: document.getElementById("conferenceNotes").value,
        };

        try {
          const response = await fetch(
            "/parent_management/schedule_conference",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(formData),
            }
          );

          const result = await response.json();

          if (result.success) {
            alert("Conference scheduled successfully!");
            resetConferenceForm();
          } else {
            alert("Error scheduling conference: " + result.message);
          }
        } catch (error) {
          alert("Error scheduling conference: " + error.message);
        }
      }

      function resetForm() {
        document.getElementById("createEventForm").reset();
      }

      function resetConferenceForm() {
        document.getElementById("conferenceForm").reset();
      }

      function generateCalendar() {
        const grid = document.getElementById("calendarGrid");
        const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        let calendarHTML = "";

        // Add headers
        daysOfWeek.forEach((day) => {
          calendarHTML += `<div class="calendar-day header">${day}</div>`;
        });

        // Add days (simplified - showing current month)
        for (let day = 1; day <= 31; day++) {
          const isToday = day === new Date().getDate();
          const hasEvents = Math.random() > 0.8; // Random events for demo

          calendarHTML += `
                    <div class="calendar-day ${isToday ? "today" : ""} ${
            hasEvents ? "has-events" : ""
          }">
                        ${day}
                        ${hasEvents ? '<div class="event-dot"></div>' : ""}
                    </div>
                `;
        }

        grid.innerHTML = calendarHTML;
      }

      async function loadParentsAndStudents() {
        // Load parents for conference scheduling
        try {
          const response = await fetch("/parent_management/search_parents?q=");
          const data = await response.json();

          if (data.parents) {
            const select = document.getElementById("conferenceParent");
            select.innerHTML =
              '<option value="">Select parent...</option>' +
              data.parents
                .map(
                  (parent) =>
                    `<option value="${parent.id}">${parent.name} (${parent.email})</option>`
                )
                .join("");
          }
        } catch (error) {
          console.error("Error loading parents:", error);
        }
      }

      function editEvent(eventId) {
        alert(
          `Edit event functionality will be implemented for event ID: ${eventId}`
        );
      }

      function viewAttendees(eventId) {
        alert(
          `View attendees functionality will be implemented for event ID: ${eventId}`
        );
      }

      function cancelEvent(eventId) {
        if (confirm("Are you sure you want to cancel this event?")) {
          alert(
            `Cancel event functionality will be implemented for event ID: ${eventId}`
          );
        }
      }

      // Set minimum date to today for event creation
      document.addEventListener("DOMContentLoaded", function () {
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("eventDate").min = today;
        document.getElementById("conferenceDate").min = today;
      });
    </script>
  </body>
